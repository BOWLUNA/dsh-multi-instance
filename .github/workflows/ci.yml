name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 刻意不跑 npm install：测试套件是零依赖的纯 Node，
      # 而 electron 是 devDependency（几十 MB 的二进制），装它只会让 CI 变慢、
      # 而且在无头 runner 上根本用不到。测试要能被这样跑起来，正是它存在的意义。
      #
      # 需要真起窗口的验证在下面单独一个 job（smoke），只有它才装 electron。
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 跑无头测试套件
        run: node tests/run.js

      # 护栏：本项目曾把 PNG / ICO 当文本处理过，图全花了（见 commit d8eb824）。
      # 这里读 magic number 复验，防止再从 patch / API 通道混进被改写的图片。
      - name: 校验图片资产没被当文本处理坏
        run: node tools/check-binary-assets.js

      - name: 语法检查（所有源码都能被解析）
        shell: bash
        run: |
          set -e
          for f in src/main/*.js src/preload/*.js src/renderer/*.js bin/cli.js tests/run.js; do
            node --check "$f"
          done
          echo "语法检查通过"

      - name: 校验 package.json 与 CHANGELOG 的版本号一致
        shell: bash
        run: |
          set -e
          PKG=$(node -p "require('./package.json').version")
          echo "package.json version = $PKG"
          grep -q "^## \[$PKG\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md 里没有 ## [$PKG] 这一节"
            exit 1
          }
          echo "版本号一致"

  # ── 窗口级冒烟 ────────────────────────────────────────────────────────
  # 上面那个 job 全是纯逻辑，**窗口里的东西一条都测不到**；而本项目的坑大多长在窗口里
  # （webview 挂不上、分区没加固、渲染层没起来）。这里真起一次应用。
  #
  # 为什么只跑 windows：本项目只有 Windows 目标（无边框窗口与边缘热区是照 Windows 调的），
  # 而 Linux runner 起 GUI 还要额外配 xvfb，测不出额外信息。
  #
  # 脚本自己起一个假 DSH 页面，不依赖网络、不依赖真实 DSH。
  smoke:
    name: smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # 只有这个 job 需要 electron 二进制（约几十 MB）
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 起一次真窗口，看网页有没有真的渲染出来
        run: npm run smoke

      - name: 失败时把冒烟现场留档
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: .tmp/smoke
          if-no-files-found: ignore
          retention-days: 7
